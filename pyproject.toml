[project]
name = "tellerline"
version = "0.1.0"
description = "On-device voice banking agent in UK English, running entirely on a MacBook Air M5."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Amogh Gaikwad" }]
dependencies = [
    # Real-time pipeline: WebRTC browser calls, dev runner, Kokoro TTS, OpenTelemetry tracing
    "pipecat-ai[webrtc,runner,kokoro,tracing]==1.10.0",
    # Gemma 4 served through an OpenAI-compatible server on Apple Silicon
    "mlx-lm==0.31.3",
    # Parakeet speech-to-text on Apple Silicon
    "mlx-audio[stt]==0.5.4",
    # RNNoise noise suppression on the caller's audio (tellerline.audio.noise)
    "pyrnnoise==0.4.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "jiwer==4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tellerline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
