; SIP over UDP. Asterisk runs in a container whose ports are published on the Mac's localhost,
; so it tells callers to reach it at 127.0.0.1.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_signaling_address = 127.0.0.1
external_media_address = 127.0.0.1

[caller-endpoint](!)
type = endpoint
context = tellerline
disallow = all
allow = g722,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[caller-auth](!)
type = auth
auth_type = userpass

[caller-aor](!)
type = aor
max_contacts = 2
remove_existing = yes

; A softphone such as Linphone or Zoiper: username "caller", password "tellerline", server
; 127.0.0.1. Wideband G.722 if the softphone offers it, otherwise G.711.
[caller](caller-endpoint)
auth = caller
aors = caller
callerid = Softphone <caller>

[caller](caller-auth)
username = caller
password = tellerline

[caller](caller-aor)

; The automated caller (python -m bench.phone): G.711 mu-law only, like a basic phone line.
[bench](caller-endpoint)
disallow = all
allow = ulaw
auth = bench
aors = bench
callerid = Bench <bench>

[bench](caller-auth)
username = bench
password = tellerline

[bench](caller-aor)
