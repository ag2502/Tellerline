; Dial 2000 for Tellerline Bank. The agent takes the call over Asterisk's WebSocket channel,
; in 16 kHz signed linear audio with JSON control messages (tellerline.agent.phone).
[tellerline]
exten => 2000,1,NoOp(Tellerline call from ${CALLERID(all)})
 same => n,Dial(WebSocket/tellerline/c(slin16)f(json))
 same => n,Hangup()
